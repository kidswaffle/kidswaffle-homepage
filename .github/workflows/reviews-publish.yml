name: reviews-publish
# Review requests that nobody closed within 3 days are published automatically (closing the pull request stops it).
on:
  schedule:
    - cron: '0 3 * * *' # every day, 12:00 Korea time
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOLD_HOURS: 72
    steps:
      - name: Merge requests that waited long enough
        run: |
          gh pr list --state open --json number,headRefName,createdAt,isDraft > prs.json
          NOW=$(date -u +%s)
          for N in $(jq -r --argjson now "$NOW" --argjson hold "$HOLD_HOURS" \
            '.[] | select(.headRefName | startswith("reviews/")) | select(.isDraft | not) | select(($now - (.createdAt | fromdateiso8601)) >= ($hold * 3600)) | .number' prs.json | sort -n); do
            echo "Publishing pull request #$N"
            gh pr merge "$N" --squash --delete-branch
          done
