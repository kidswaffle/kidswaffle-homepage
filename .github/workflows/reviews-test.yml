name: reviews-test
on:
  schedule:
    - cron: '0 1 1 * *' # the 1st of every month, 10:00 Korea time
  push:
    branches: [reviews-test]
permissions:
  contents: write
  pull-requests: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright@1.49.1 nodemailer@6.9.16
      - run: npx playwright install --with-deps chromium
      - name: Collect and screen reviews
        run: node scripts/reviews/collect.mjs
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: Open the approval pull request (test)
        run: |
          mkdir -p testlog
          node -e "console.log(require('fs').existsSync('pr-title.txt') ? 'has-candidates' : 'nothing-new')" > testlog/state.txt
          if [ ! -f pr-title.txt ]; then exit 0; fi
          git config user.name "reviews-bot"; git config user.email "bot@users.noreply.github.com"
          BR="reviews/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -q -b "$BR"
          git add src/data/reviews-auto.json
          git commit -q -m "$(cat pr-title.txt)"
          git push -u origin "$BR" > testlog/push.txt 2>&1 || true
          gh pr create --base main --head "$BR" --title "$(cat pr-title.txt)" --body-file pr-body.md > testlog/pr.txt 2>&1 || true
      - name: Save the test log
        if: always()
        run: |
          mkdir -p testlog; cp pr-body.md testlog/ 2>/dev/null || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -q -B reviews-test-log; git add -f testlog; git commit -q -m "test log" || true
          git push -f origin reviews-test-log
