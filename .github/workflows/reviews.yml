name: monthly-reviews
on:
  schedule:
    - cron: '0 1 1 * *' # the 1st of every month, 10:00 Korea time
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright@1.49.1 nodemailer@6.9.16
      - run: npx playwright install --with-deps chromium
      - name: Skip if an earlier request is still waiting
        id: waiting
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("reviews/"))] | length')
          echo "waiting=$N" >> "$GITHUB_OUTPUT"
          echo "Open review requests: $N"
      - name: Collect and screen reviews
        if: steps.waiting.outputs.waiting == '0'
        run: node scripts/reviews/collect.mjs
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: Open the approval pull request
        run: |
          if [ ! -f pr-title.txt ]; then echo "Nothing new this month."; exit 0; fi
          git config user.name "reviews-bot"; git config user.email "bot@users.noreply.github.com"
          BR="reviews/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BR"
          git add src/data/reviews-auto.json
          git commit -m "$(cat pr-title.txt)"
          git push -u origin "$BR"
          URL=$(gh pr create --base main --head "$BR" --title "$(cat pr-title.txt)" --body-file pr-body.md) || {
            echo "::error::Could not open the approval pull request. Turn on Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand: https://github.com/${{ github.repository }}/pull/new/$BR"
            exit 1
          }
          echo "PR_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL"
      - name: Email the approval request
        if: env.PR_URL != ''
        run: node scripts/reviews/notify.mjs
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
