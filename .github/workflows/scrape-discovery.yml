name: scrape-discovery
on:
  push:
    branches: [scrape-discovery]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/discover-classkok.mjs
      - name: Save results
        run: |
          git config user.name "discovery-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f discovery4
          git commit -m "Discovery results" || echo "nothing"
          git push
