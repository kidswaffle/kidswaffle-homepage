name: site-check
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/rawdump.mjs
      - name: Can images be downloaded without a session?
        run: |
          U=$(node -e "const o=require('./rawdump/out.json');const s=o.suwon&&o.suwon.sample;console.log(s?JSON.stringify(s):'')")
          echo "$U" > rawdump/sample.txt
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f rawdump; git commit -m "rawdump"; git push
