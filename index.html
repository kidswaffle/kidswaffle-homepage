<h1>키즈와플 오감팡팡 | 부모와 함께하는 영유아 오감놀이</h1>
<p>키즈와플 오감팡팡은 문화센터에서 엄마와 5~24개월 영유아가 함께 듣는 오감놀이 수업입니다. 한 클래스 최대 10명, 매주 바뀌는 테마 놀이와 포토존 사진으로 아이의 첫 놀이를 기록합니다.</p>
<h2>오감놀이 커리큘럼 - 하나의 주제로 연결된 오감놀이</h2>
<ul>
<li>인사·노래: 엄마와 함께 인사하고, 악기로 소리와 리듬을 느끼며, 끝 인사노래로 마무리합니다.</li>
<li>인지카드: 선생님이 단어를 읽으면 엄마가 따라 읽고, 아이는 보고 들으며 시각과 청각을 자극합니다.</li>
<li>오감교구: 1:1 오감활동으로 아이의 성향을 확인하고, 아이에 맞게 활동을 진행합니다. 교구는 매 수업 소독하며 구강기 교구는 따로 관리합니다.</li>
<li>포토존·정리: 매주 새로운 테마 포토존에서 영유아 아이만 촬영하고, 놀이 후에는 엄마와 함께 정리합니다.</li>
</ul>
<h2>자주 묻는 질문</h2>
<ul>
<li>몇 개월부터 참여할 수 있나요? 생후 5개월부터 24개월까지의 영유아가 부모와 함께 참여합니다.</li>
<li>클래스당 인원은 몇 명인가요? 한 클래스 최대 10명입니다.</li>
<li>수강 신청은 어떻게 하나요? 문화센터 강좌로 운영하며, 카카오톡으로 상담을 남겨 주시면 가까운 지점과 학기 일정을 안내해 드립니다.</li>
</ul>
<h2>함께하는 문화센터</h2>
<p>신세계백화점, 이마트, 스타필드 클래스콕, 롯데백화점, 현대백화점, 서울시육아종합지원센터, 경기도 육아종합지원센터, AK플라자, 갤러리아 문화센터에서 수업합니다.</p>
